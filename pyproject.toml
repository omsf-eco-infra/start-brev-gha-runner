[project]
name = "start-brev-gha-runner"
version = "0.1.0"
description = "Start an ephemeral GitHub Actions runner on NVIDIA Brev"
readme = "README.md"
authors = [
    { name = "Ethan Holz", email = "ethan.holz@omsf.io" }
]
requires-python = ">=3.12"
dependencies = ["gha-runner>=0.7.0"]

[project.scripts]
start-brev-gha-runner = "start_brev_gha_runner:main"

[build-system]
requires = ["uv_build>=0.11.19,<0.12.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 80

[dependency-groups]
dev = [
    "ruff==0.15.14",
]
