[project]
name = "start-brev-gha-runner"
version = "0.1.0"
description = "Start an ephemeral GitHub Actions runner on NVIDIA Brev"
readme = "README.md"
authors = [
    { name = "Ethan Holz", email = "ethan.holz@omsf.io" }
]
requires-python = ">=3.12"
dependencies = ["gha-runner>=0.7.0"]

[project.scripts]
start-brev-gha-runner = "start_brev_gha_runner:main"

[build-system]
requires = ["uv_build>=0.11.19,<0.14.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 80

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64", "linux-aarch64", "osx-64", "osx-arm64"]

[tool.pixi.dependencies]
python = "3.12.*"
brev = ">=0.6.337,<0.7"

[tool.pixi.pypi-dependencies]
start-brev-gha-runner = { path = ".", editable = true }

[tool.pixi.feature.dev.dependencies]
ruff = "==0.17.3"

[tool.pixi.feature.dev.tasks]
test = "python -m unittest discover -s tests"
lint = "ruff check --output-format=github ."
format-check = "ruff format --check ."

[tool.pixi.environments]
default = { features = ["dev"], solve-group = "default" }
prod = { features = [], solve-group = "default" }
